apiVersion: v1
kind: Namespace
metadata:
  name: aws-restart-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: restart-lab-apps
  namespace: aws-restart-lab
data:
  oom_app.py: |
    import json
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    allocated = []

    def allocator():
        chunk_size = 4 * 1024 * 1024
        while True:
            allocated.append(bytearray(chunk_size))
            print(
                json.dumps(
                    {
                        "event": "allocated",
                        "chunks": len(allocated),
                        "approx_mib": len(allocated) * 4,
                    }
                ),
                flush=True,
            )
            time.sleep(1)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/health":
                payload = {
                    "status": "ok",
                    "allocated_chunks": len(allocated),
                    "approx_mib": len(allocated) * 4,
                }
                body = json.dumps(payload).encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return

            self.send_response(404)
            self.end_headers()

        def log_message(self, fmt, *args):
            print(json.dumps({"request": fmt % args}), flush=True)

    threading.Thread(target=allocator, daemon=True).start()
    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

  healthy_app.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/health":
                body = json.dumps({"status": "ok", "container": "app"}).encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return

            self.send_response(404)
            self.end_headers()

        def log_message(self, fmt, *args):
            print(json.dumps({"request": fmt % args}), flush=True)

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-probes-healthy
  namespace: aws-restart-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-app
      scenario: oom-probes-healthy
  template:
    metadata:
      labels:
        app: oom-app
        scenario: oom-probes-healthy
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/oom_app.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          volumeMounts:
            - name: apps
              mountPath: /app
              readOnly: true
      volumes:
        - name: apps
          configMap:
            name: restart-lab-apps
---
apiVersion: v1
kind: Service
metadata:
  name: oom-app
  namespace: aws-restart-lab
spec:
  selector:
    app: oom-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar-crash
  namespace: aws-restart-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidecar-app
      scenario: sidecar-crash
  template:
    metadata:
      labels:
        app: sidecar-app
        scenario: sidecar-crash
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/healthy_app.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: apps
              mountPath: /app
              readOnly: true
        - name: crashing-sidecar
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "sidecar started"
              sleep 12
              echo "injected sidecar failure" >&2
              exit 42
          resources:
            requests:
              cpu: 5m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 16Mi
      volumes:
        - name: apps
          configMap:
            name: restart-lab-apps
---
apiVersion: v1
kind: Service
metadata:
  name: sidecar-app
  namespace: aws-restart-lab
spec:
  selector:
    app: sidecar-app
  ports:
    - name: http
      port: 80
      targetPort: http
