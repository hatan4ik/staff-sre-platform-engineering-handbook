apiVersion: v1
kind: Pod
metadata:
  name: impossible-placement
  namespace: sre-conformance
  labels:
    app: impossible-placement
spec:
  restartPolicy: Never
  nodeSelector:
    platform.example.com/nonexistent-capacity: "true"
  containers:
    - name: hold
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
