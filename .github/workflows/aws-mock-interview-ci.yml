name: AWS mock interview CI

on:
  pull_request:
    paths:
      - "tracks/aws/mock-sessions/**"
      - ".github/workflows/aws-mock-interview-ci.yml"
  push:
    branches:
      - main
    paths:
      - "tracks/aws/mock-sessions/**"
      - ".github/workflows/aws-mock-interview-ci.yml"

permissions:
  contents: read

concurrency:
  group: aws-mock-interview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate and test mock interview runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracks/aws/mock-sessions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile runner and tests
        run: python -m compileall -q mock_runner.py test_mock_runner.py

      - name: Validate baseline session
        run: python mock_runner.py --validate-only

      - name: Run unit tests
        run: python -m unittest -v
