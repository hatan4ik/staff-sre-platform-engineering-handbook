apiVersion: apps/v1
kind: Deployment
metadata:
  name: exit-zero
  namespace: restart-lab
  labels:
    app: exit-zero
    scenario: exit-zero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exit-zero
  template:
    metadata:
      labels:
        app: exit-zero
        scenario: exit-zero
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              touch /tmp/ready
              echo "$(date -u +%FT%TZ) ready; process will complete successfully in 20 seconds"
              sleep 20
              echo "$(date -u +%FT%TZ) exiting with code 0"
              exit 0
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/ready"]
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/ready"]
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
