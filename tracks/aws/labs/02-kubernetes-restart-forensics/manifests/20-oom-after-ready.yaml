apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-after-ready
  namespace: restart-lab
  labels:
    app: oom-after-ready
    scenario: oom-after-ready
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-after-ready
  template:
    metadata:
      labels:
        app: oom-after-ready
        scenario: oom-after-ready
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          command:
            - /bin/sh
            - -c
            - |
              exec python - <<'PY'
              import http.server
              import socketserver
              import threading
              import time

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"ok\n")

                  def log_message(self, format, *args):
                      return

              server = socketserver.TCPServer(("0.0.0.0", 8080), Handler)
              threading.Thread(target=server.serve_forever, daemon=True).start()
              print("health server ready; memory pressure starts in 10 seconds", flush=True)
              time.sleep(10)

              chunks = []
              allocation = 0
              while True:
                  chunks.append(bytearray(5 * 1024 * 1024))
                  allocation += 5
                  print(f"allocated approximately {allocation} MiB", flush=True)
                  time.sleep(0.25)
              PY
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
